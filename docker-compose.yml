services:
  mongo:
    image: mongo:7
    container_name: ai_ticket_it_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ai_ticket_it_mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_ticket_it_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/ai-ticket-it
    depends_on:
      - mongo

volumes:
  ai_ticket_it_mongo_data:
